<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="/favicon.ico"/>
    
    <!-- Sets the colour-scheme attribute before first paint so Mantine's own
         tokens resolve immediately. Gatsby did this with <ColorSchemeScript>
         in gatsby-ssr.tsx; a client-only build has to inline it. Logic copied
         verbatim from Mantine's ColorSchemeScript with defaultColorScheme
         "auto", to match MantineProvider in main.tsx. -->
    <script data-mantine-script="true">
        try {
            var _colorScheme = window.localStorage.getItem("mantine-color-scheme-value");
            var colorScheme = _colorScheme === "light" || _colorScheme === "dark" || _colorScheme === "auto" ? _colorScheme : "auto";
            var computedColorScheme = colorScheme !== "auto" ? colorScheme : window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            document.documentElement.setAttribute("data-mantine-color-scheme", computedColorScheme);
        } catch (e) {
        }
    </script>

    <title>Open-Source Software at G-Research</title>
    <meta name="description"
          content="Explore G-Research's open-source projects and learn more about our Open Source Program Office."/>

    <!-- Link previews. -->
    <meta property="og:type" content="website"/>
    <meta property="og:site_name" content="G-Research"/>
    <meta property="og:title" content="Open-Source Software at G-Research"/>
    <meta property="og:description"
          content="Explore G-Research's open-source projects and learn more about our Open Source Program Office."/>
    <meta property="og:url" content="https://g-research.github.io/"/>
    <meta name="twitter:card" content="summary_large_image"/>
    <meta name="twitter:site" content="@oss_gr"/>
    <link rel="canonical" href="https://g-research.github.io/"/>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
